name: Deploy Lambda Function

on:
  # Manual trigger so a rebuilt function can be filled with real code without a
  # dummy commit (tools/infra_setup.py creates functions with placeholder code).
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'src/lambda_function.py'
      - 'src/game_parser.py'
      - 'src/scoreboard.py'
      - 'src/store.py'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production 
    
    env:
      AWS_DEFAULT_REGION: us-east-1
      LAMBDA_FUNCTION_NAME: daily-game-score
      FILE_NAME: lambda_function.py
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    
    - name: Package Lambda function
      run: |
        # requests is bundled rather than taken from the Klayers-p311-requests
        # layer (a 3.11 build on a 3.13 runtime); /var/task wins over /opt, so
        # this shadows the layer and the layer can be detached afterwards.
        # python-dateutil is bundled because game_parser imports it directly and
        # must not depend on the runtime's bundled boto3 vendoring a copy.
        echo "📦 Installing dependencies in Lambda-compatible container..."
        docker run --rm -v "$PWD":/var/task public.ecr.aws/sam/build-python3.13:latest \
          bash -c "pip install requests Pillow python-dateutil -t /var/task/package/"
        cd package && zip -r ../function.zip . && cd ..
        # -j flattens src/ away: the handler is "<module>.lambda_handler", so
        # these modules must sit at the zip root, not under src/.
        zip -j function.zip src/${{ env.FILE_NAME }} src/game_parser.py src/scoreboard.py src/store.py
        echo "✅ Package created: $(ls -lh function.zip | awk '{print $5}')"

        echo "🔎 Verifying handler modules and vendored deps are at the zip root..."
        python3 - "$FILE_NAME" <<'PY'
        import sys, zipfile
        roots = {n.split("/")[0] for n in zipfile.ZipFile("function.zip").namelist()}
        modules = {sys.argv[1], "game_parser.py", "scoreboard.py", "store.py"}
        deps = {"requests", "dateutil", "PIL"}
        missing = sorted((modules | deps) - roots)
        if missing:
            print(f"::error::missing from zip root: {', '.join(missing)}")
            sys.exit(1)
        print(f"zip root OK: {len(modules)} modules + {len(deps)} vendored deps")
        PY
    
    - name: Deploy to Lambda
      run: |
        echo "🚀 Deploying to Lambda function: $LAMBDA_FUNCTION_NAME"
        aws lambda update-function-code \
          --function-name $LAMBDA_FUNCTION_NAME \
          --zip-file fileb://function.zip \
          --output json | jq '.LastModified'
    
    - name: Wait for deployment
      run: |
        echo "⏳ Waiting for Lambda update to complete..."
        aws lambda wait function-updated \
          --function-name $LAMBDA_FUNCTION_NAME
        echo "✅ Deployment complete!"
    
    - name: Run test event
      timeout-minutes: 1
      run: |
        echo "🧪 Testing Lambda function..."
        
        # Create test payload
        echo '{"test": "Hello from GitHub Actions!"}' > test-event.json
        
        # Invoke Lambda
        aws lambda invoke \
          --function-name $LAMBDA_FUNCTION_NAME \
          --payload file://test-event.json \
          --cli-binary-format raw-in-base64-out \
          response.json
        
        # Display results
        echo "📋 Lambda response:"
        cat response.json | jq '.'
        
        # Check for success
        if cat response.json | jq -e '.statusCode == 200' > /dev/null 2>&1; then
          echo "✅ Test passed!"
        else
          echo "❌ Test failed - check the response above"
          exit 1
        fi