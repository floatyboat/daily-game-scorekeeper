name: Deploy Interaction Lambda

on:
  # Manual trigger so a rebuilt function can be filled with real code without a
  # dummy commit (tools/infra_setup.py creates functions with placeholder code).
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'src/interaction_lambda.py'
      - 'src/game_parser.py'
      - 'src/scoreboard.py'
      - 'src/store.py'
      - 'src/commentary.py'
      - 'tools/register_commands.py'
      - '.github/workflows/deploy-interaction.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_DEFAULT_REGION: us-east-1
      LAMBDA_FUNCTION_NAME: daily-game-play
      FILE_NAME: interaction_lambda.py

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - name: Package Lambda function
      run: |
        # python-dateutil is bundled because game_parser imports it directly and
        # must not depend on the runtime's bundled boto3 vendoring a copy.
        echo "Installing dependencies in Lambda-compatible container..."
        docker run --rm -v "$PWD":/var/task public.ecr.aws/sam/build-python3.14:latest \
          bash -c "pip install PyNaCl requests Pillow python-dateutil -t /var/task/package/"
        cd package && zip -r ../function.zip . && cd ..
        # -j flattens src/ away: the handler is "<module>.lambda_handler", so
        # these modules must sit at the zip root, not under src/.
        zip -j function.zip src/${{ env.FILE_NAME }} src/game_parser.py src/scoreboard.py src/store.py src/commentary.py
        echo "Package created: $(ls -lh function.zip | awk '{print $5}')"

        echo "Verifying handler modules and vendored deps are at the zip root..."
        python3 - "$FILE_NAME" <<'PY'
        import sys, zipfile
        roots = {n.split("/")[0] for n in zipfile.ZipFile("function.zip").namelist()}
        modules = {sys.argv[1], "game_parser.py", "scoreboard.py", "store.py", "commentary.py"}
        deps = {"requests", "dateutil", "PIL", "nacl"}
        missing = sorted((modules | deps) - roots)
        if missing:
            print(f"::error::missing from zip root: {', '.join(missing)}")
            sys.exit(1)
        print(f"zip root OK: {len(modules)} modules + {len(deps)} vendored deps")
        PY

    - name: Deploy to Lambda
      run: |
        echo "Deploying to Lambda function: $LAMBDA_FUNCTION_NAME"
        aws lambda update-function-code \
          --function-name $LAMBDA_FUNCTION_NAME \
          --zip-file fileb://function.zip \
          --output json | jq '.LastModified'

    - name: Wait for deployment
      run: |
        echo "Waiting for Lambda update to complete..."
        aws lambda wait function-updated \
          --function-name $LAMBDA_FUNCTION_NAME
        echo "Deployment complete!"

    - name: Register slash commands
      # After the deploy, so the function already answers any new command or
      # option by the time Discord offers it. register_commands.py is a bulk
      # overwrite, so a run with nothing new changes nothing. The bot's identity
      # is read off the function's own environment, where it already lives,
      # rather than kept a second time as a repository secret.
      run: |
        pip install --quiet requests python-dateutil boto3 python-dotenv
        token=$(aws lambda get-function-configuration --function-name "$LAMBDA_FUNCTION_NAME" \
          --query 'Environment.Variables.DISCORD_BOT_TOKEN' --output text)
        echo "::add-mask::$token"
        bot_id=$(aws lambda get-function-configuration --function-name "$LAMBDA_FUNCTION_NAME" \
          --query 'Environment.Variables.DISCORD_BOT_ID' --output text)
        DISCORD_BOT_TOKEN="$token" DISCORD_BOT_ID="$bot_id" python3 tools/register_commands.py
